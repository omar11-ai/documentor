<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        .prose pre { background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .prose code { background: #f3f4f6; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875em; }
        .prose pre code { background: none; padding: 0; font-size: inherit; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-gray-900">
                        <i class="fas fa-book mr-2 text-blue-600"></i>DocuMentor
                    </a>
                    <span class="mx-3 text-gray-400">/</span>
                    <span class="text-gray-500">{{ module_name }}</span>
                </div>
                <div class="flex items-center space-x-4">
                    <form action="/search" method="get" class="hidden md:block">
                        <input
                            type="search"
                            name="q"
                            placeholder="Search documentation..."
                            class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-64"
                        >
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">{{ module_name }}</h1>
        </div>

        <div class="prose prose-lg max-w-none">
            {{ content | safe }}
        </div>

        {% if entities %}
        <div class="mt-12">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Entities</h2>
            <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                {% for entity in entities %}
                <a href="{{ entity.path }}" class="bg-white border border-gray-200 rounded-xl p-4 hover:border-blue-300 hover:shadow-md transition-all">
                    <i class="fas fa-code text-blue-600 mr-2"></i>
                    <span class="font-mono text-sm">{{ entity.name }}</span>
                </a>
                {% endfor %}
            </div>
        </div>
        {% endif %}
    </main>

    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-500">
            Generated by <a href="https://github.com/yourusername/documentor" class="text-blue-600 hover:underline">DocuMentor</a>
        </div>
    </footer>
</body>
</html>
