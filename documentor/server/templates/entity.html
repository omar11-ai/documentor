<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        .prose pre { background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .prose code { background: #f3f4f6; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875em; }
        .prose pre code { background: none; padding: 0; font-size: inherit; }
        .toc { position: sticky; top: 5rem; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-gray-900">
                        <i class="fas fa-book mr-2 text-blue-600"></i>DocuMentor
                    </a>
                    <span class="mx-3 text-gray-400">/</span>
                    <a href="/module/{{ module_name }}" class="text-blue-600 hover:text-blue-700">{{ module_name }}</a>
                    <span class="mx-3 text-gray-400">/</span>
                    <span class="text-gray-500">{{ entity_name }}</span>
                </div>
                <div class="flex items-center space-x-4">
                    <form action="/search" method="get" class="hidden md:block">
                        <input
                            type="search"
                            name="q"
                            placeholder="Search documentation..."
                            class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-64"
                        >
                    </form>
                </div>
            </div>
        </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-3">
                <header class="mb-8">
                    <h1 class="text-3xl font-bold text-gray-900">{{ entity_name }}</h1>
                    <div class="mt-2 flex items-center space-x-4 text-sm text-gray-500">
                        <span>Module: <a href="/module/{{ module_name }}" class="text-blue-600 hover:underline">{{ module_name }}</a></span>
                    </div>
                </header>

                <article class="prose prose-lg max-w-none">
                    {{ content | safe }}
                </article>
            </div>

            <aside class="hidden lg:block">
                <nav class="toc">
                    <h3 class="text-sm font-semibold text-gray-900 mb-3">On this page</h3>
                    <nav id="toc" class="space-y-1 text-sm text-gray-600">
                        <!-- TOC will be generated by JS -->
                    </nav>
                </nav>
            </aside>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-500">
            Generated by <a href="https://github.com/yourusername/documentor" class="text-blue-600 hover:underline">DocuMentor</a>
        </div>
    </footer>

    <script>
        // Generate TOC from headings
        document.addEventListener('DOMContentLoaded', () => {
            const toc = document.getElementById('toc');
            const headings = document.querySelectorAll('.prose h2, .prose h3');

            headings.forEach((heading, index) => {
                const id = heading.id || `heading-${index}`;
                heading.id = id;

                const link = document.createElement('a');
                link.href = `#${id}`;
                link.textContent = heading.textContent;
                link.className = `block py-1 px-2 rounded hover:bg-blue-50 ${heading.tagName === 'H3' ? 'ml-4' : ''}`;

                toc.appendChild(link);
            });
        });
    </script>
</body>
</html>
